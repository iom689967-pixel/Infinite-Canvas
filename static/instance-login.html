<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Infinite-Canvas</title><link rel="stylesheet" href="/static/css/instance-login.css">
<script src="/static/js/instance-login.js" defer></script></head>
<body><main class="login-card"><h1>Infinite-Canvas</h1><p>登录自己的实例工作台</p>
<form id="instance-login"><label>账号<input name="username" autocomplete="username" required maxlength="64"></label>
<label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
<button type="submit">登录</button><p id="login-error" role="alert"></p></form>
<small>账号由本机管理员创建。此实例尚未开放远程访问。</small></main></body></html>
