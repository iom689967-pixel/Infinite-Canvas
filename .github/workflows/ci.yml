name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Install verified temporary Caddy fixture
        run: python scripts/install_rehearsal_caddy.py "$RUNNER_TEMP/mio-rehearsal-caddy"

      - name: Rehearse first upgrade from real legacy code
        run: python tests/rehearse_legacy_upgrade.py --caddy "$RUNNER_TEMP/mio-rehearsal-caddy" --evidence "$RUNNER_TEMP/mio-first-upgrade-evidence.json"

      - name: Preserve safe rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-first-upgrade-evidence
          path: ${{ runner.temp }}/mio-first-upgrade-evidence.json
          if-no-files-found: error
